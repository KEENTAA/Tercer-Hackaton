version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  execution-service:
    build:
      context: ./backend/execution-service
    container_name: execution-service
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    expose:
      - "8000"

  plagiarism-service:
    build:
      context: ./backend/plagiarism-service
    container_name: plagiarism-service
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "8000"

  gateway:
    build:
      context: ./backend/gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - execution-service
      - plagiarism-service
    environment:
      - EXECUTION_SERVICE_URL=${EXECUTION_SERVICE_URL}
      - PLAGIARISM_SERVICE_URL=${PLAGIARISM_SERVICE_URL}

volumes:
  postgres_data:
